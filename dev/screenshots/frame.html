<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Store screenshot template, filled in by `ext-store screenshots` (see screenshots.frame in ext-store.config.ts). -->
    <style>
      :root {
        --ink: #15161c;
        --accent: #6c3be8;
        --tab-strip: #dee3eb;
        --toolbar: #ffffff;
        --omnibox: #eef1f6;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        width: 1280px;
        height: 800px;
        overflow: hidden;
        font-family:
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
        background: #f4f2fc;
      }

      body.dark {
        --ink: #f1f1f6;
        --accent: #a58bff;
        --tab-strip: #1c1d27;
        --toolbar: #23252f;
        --omnibox: #181a23;
        background: #0e0f16;
      }

      body.dark .tab,
      body.dark .toolbar {
        color: #c9cad6;
      }

      .backdrop {
        position: absolute;
        inset: 0;
        background-size: cover;
      }

      h1 {
        position: absolute;
        top: 44px;
        left: 0;
        right: 0;
        text-align: center;
        color: var(--ink);
        font-size: 50px;
        font-weight: 700;
        line-height: 1.08;
        letter-spacing: -0.02em;
      }

      h1 span {
        display: block;
        color: var(--accent);
      }

      .window {
        position: absolute;
        top: 176px;
        left: 100px;
        width: 1080px;
        border-radius: 14px;
        overflow: hidden;
        background: var(--toolbar);
        box-shadow:
          0 1px 2px rgb(2 14 44 / 0.08),
          0 24px 60px -12px rgb(2 14 44 / 0.35);
        outline: 1px solid rgb(2 14 44 / 0.08);
      }

      .tabs {
        display: flex;
        align-items: flex-end;
        gap: 10px;
        height: 34px;
        padding: 0 10px;
        background: var(--tab-strip);
      }

      .dots {
        display: flex;
        gap: 7px;
        align-self: center;
        margin-right: 8px;
      }

      .dots i {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: var(--accent);
      }

      .tab {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 210px;
        height: 28px;
        padding: 0 12px;
        border-radius: 9px 9px 0 0;
        background: var(--toolbar);
        color: #1f2937;
        font-size: 12px;
      }

      .tab img {
        width: 14px;
        height: 14px;
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 14px;
        height: 34px;
        padding: 0 14px;
        color: #6b7280;
        font-size: 13px;
      }

      .omnibox {
        flex: 1;
        height: 24px;
        padding: 0 14px;
        border-radius: 12px;
        background: var(--omnibox);
        line-height: 24px;
        font-size: 12px;
      }

      .screen {
        display: block;
        width: 1080px;
        height: 540px;
      }
    </style>
  </head>
  <body>
    <div class="backdrop"></div>
    <h1></h1>
    <div class="window">
      <div class="tabs">
        <div class="dots"><i></i><i></i><i></i></div>
        <div class="tab">
          <img class="icon" alt="" /><span class="title"></span>
        </div>
      </div>
      <div class="toolbar">
        <span>←</span><span>→</span><span>↻</span>
        <div class="omnibox"><span class="url"></span></div>
      </div>
      <img class="screen" alt="" />
    </div>
    <script>
      /** Called by the script with the headline and the captured UI. */
      window.render = ({
        headline: [first, second],
        screen,
        backdrop: photo,
        title,
        icon,
      }) => {
        document.body.classList.toggle("dark", /dark/.test(photo));
        document.querySelector(".title").textContent = title;
        document.querySelector(".url").textContent = `Extension (${title})`;
        document.querySelector(".icon").src = icon;
        const accent = document.createElement("span");

        accent.textContent = second;
        document.querySelector("h1").replaceChildren(first, accent);
        document.querySelector(".screen").src = screen;
        document.querySelector(".backdrop").style.backgroundImage =
          `url("${photo}")`;

        const backdrop = new Image();

        backdrop.src = photo;

        return Promise.all([
          document.querySelector(".icon").decode(),
          document.querySelector(".screen").decode(),
          backdrop.decode(),
        ]);
      };
    </script>
  </body>
</html>
