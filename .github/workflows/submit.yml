name: Submit to the stores

# Submits to the Chrome Web Store and Firefox Add-ons when a version tag is pushed
# (`V1.0.1`), which `bun tag-release` does. See docs/releasing.md.
on:
  push:
    tags:
      - "V*"

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    # Holds the store credentials. Add required reviewers to this environment
    # to approve each submission by hand.
    environment: stores
    env:
      CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
      CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
      CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
      FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
      FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
      FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
    steps:
      - name: 👀 Checkout code
        uses: actions/checkout@v4
      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile
      - name: 🏷️ Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "V$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi
      - name: 🔎 Check types
        run: bun run typecheck
      - name: 🧪 Run tests
        run: bun test
      - name: 🚀 Build and submit
        run: bun run store:submit --yes
