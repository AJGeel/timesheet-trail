name: CI

# Validates every push and pull request: types, formatting, tests and the build.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 👀 Checkout code
        uses: actions/checkout@v4
      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile
      - name: 🔎 Check types
        run: bun run typecheck
      - name: 🎨 Check formatting
        run: bun run format:check
      - name: 🧪 Run tests
        run: bun test
      - name: 🏗️ Build
        run: bun run build
